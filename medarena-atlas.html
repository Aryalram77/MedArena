<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedArena Atlas</title>
  <meta name="description" content="Interactive MedArena anatomy atlas cards: Circle of Willis and Nephron.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #0b0f17;
      --bg-surface: #0d121c;
      --bg-panel: #0f172a;
      --border-subtle: rgba(30, 41, 59, 0.9);
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 10px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.015em;
      white-space: nowrap;
    }

    .atlas-back {
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .atlas-back:hover {
      color: var(--accent-cyan);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .brand-divider { color: #475569; }

    .card-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .atlas-tab {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #1e293b;
      background: var(--bg-panel);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .atlas-tab:hover {
      border-color: #475569;
      color: #e2e8f0;
    }

    .atlas-tab[aria-selected="true"] {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #020617;
    }

    .atlas-tab:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    .atlas-stage {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .atlas-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: var(--bg-canvas);
    }

    .atlas-frame.active { display: block; }

    @media (max-width: 640px) {
      .topbar { padding: 10px 14px; gap: 10px; }
      .card-tabs { width: 100%; margin-left: 0; }
      .atlas-tab { flex: 1; justify-content: center; padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand"><a class="atlas-back" href="index.html" aria-label="Back to MedArena">← MedArena</a><span class="brand-divider">·</span>MedArena Atlas</span>
    <nav class="card-tabs" id="atlasTabs" role="tablist" aria-label="Atlas cards"></nav>
  </header>

  <main class="atlas-stage" id="atlasStage"></main>

  <script>
    (function () {
      'use strict';

      // Add a new object here to create another Atlas card.
      const CARDS = [
        { id: 'circle-of-willis', label: '🧠 Circle of Willis', src: 'circle-of-willis-atlas.html?embed=1', title: 'Circle of Willis interactive atlas' },
        { id: 'nephron', label: '🫘 Nephron', src: 'nephron-atlas.html?embed=1', title: 'Nephron interactive atlas' }
      ];

      const STORAGE_KEY = 'medarena.atlas.activeCard';
      const tabs = document.getElementById('atlasTabs');
      const stage = document.getElementById('atlasStage');
      const buttonMap = new Map();
      const frameMap = new Map();

      function storedCard() {
        try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (e) { return ''; }
      }

      function rememberCard(id) {
        try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
      }

      function activate(id, moveFocus) {
        const active = CARDS.find((card) => card.id === id) || CARDS[0];

        CARDS.forEach((card) => {
          const selected = card.id === active.id;
          const button = buttonMap.get(card.id);
          const frame = frameMap.get(card.id);

          button.setAttribute('aria-selected', selected ? 'true' : 'false');
          button.tabIndex = selected ? 0 : -1;
          button.classList.toggle('active', selected);
          frame.classList.toggle('active', selected);

          if (selected && !frame.getAttribute('src')) {
            frame.setAttribute('src', frame.dataset.src);
          }
        });

        rememberCard(active.id);
        if (moveFocus) buttonMap.get(active.id).focus();
      }

      CARDS.forEach((card, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'atlas-tab';
        button.id = 'atlas-tab-' + card.id;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', 'atlas-frame-' + card.id);
        button.setAttribute('aria-selected', 'false');
        button.textContent = card.label;
        button.addEventListener('click', () => activate(card.id));
        button.addEventListener('keydown', (event) => {
          if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
          event.preventDefault();
          const step = event.key === 'ArrowRight' ? 1 : -1;
          const next = CARDS[(index + step + CARDS.length) % CARDS.length];
          activate(next.id, true);
        });
        tabs.appendChild(button);
        buttonMap.set(card.id, button);

        const frame = document.createElement('iframe');
        frame.id = 'atlas-frame-' + card.id;
        frame.className = 'atlas-frame';
        frame.title = card.title;
        frame.setAttribute('role', 'tabpanel');
        frame.setAttribute('aria-labelledby', button.id);
        frame.setAttribute('loading', 'eager');
        frame.dataset.src = card.src;
        stage.appendChild(frame);
        frameMap.set(card.id, frame);
      });

      const saved = storedCard();
      activate(CARDS.some((card) => card.id === saved) ? saved : CARDS[0].id);
    })();
  </script>
</body>
</html>
