<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedArena Atlas</title>
  <meta name="description" content="Interactive MedArena atlas cards: Circle of Willis, Nephron, ECG, and Cardiology Auscultation.">
  <script>window.MA_API_BASE = "https://medarena-api.medarena-ram.workers.dev";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #0b0f17;
      --bg-surface: #0d121c;
      --bg-panel: #0f172a;
      --border-subtle: rgba(30, 41, 59, 0.9);
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #22d3ee;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 10px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.015em;
      white-space: nowrap;
    }

    .atlas-back {
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .atlas-back:hover {
      color: var(--accent-cyan);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .brand-divider { color: #475569; }

    .card-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .tabs-label {
      color: #64748b;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .atlas-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: var(--bg-panel);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .atlas-tab:hover {
      border-color: var(--accent-cyan);
      color: #fff;
      transform: translateY(-1px);
    }

    .atlas-tab[aria-selected="true"] {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #020617;
      box-shadow: 0 4px 14px rgba(34, 211, 238, 0.25);
    }

    .atlas-tab:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    .atlas-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--bg-canvas);
    }

    .atlas-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: var(--bg-canvas);
    }

    .atlas-frame.active { display: block; }

    @media (max-width: 640px) {
      .topbar { padding: 10px 14px; gap: 10px; }
      .card-switcher { width: 100%; margin-left: 0; }
      .card-tabs { width: 100%; }
      .atlas-tab { flex: 1; padding: 8px 10px; font-size: 12px; }
    }
    .atlas-copyright {
      flex-shrink: 0;
      padding: 6px 12px;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      letter-spacing: 0.02em;
      text-align: center;
    }

</style>
</head>
<body>
  <header class="topbar">
    <span class="brand"><a class="atlas-back" href="index.html" aria-label="Back to MedArena">← MedArena</a><span class="brand-divider">·</span>MedArena Atlas</span>

    <div class="card-switcher">
      <span class="tabs-label">Atlas cards</span>
      <nav class="card-tabs" role="tablist" aria-label="Atlas cards">
        <button type="button" class="atlas-tab" id="atlas-tab-circle" role="tab" aria-selected="true" aria-controls="atlas-frame-circle" tabindex="0" data-card="circle">🧠 Circle of Willis</button>
        <button type="button" class="atlas-tab" id="atlas-tab-nephron" role="tab" aria-selected="false" aria-controls="atlas-frame-nephron" tabindex="-1" data-card="nephron">🫘 Nephron</button>
        <button type="button" class="atlas-tab" id="atlas-tab-ecg" role="tab" aria-selected="false" aria-controls="atlas-frame-ecg" tabindex="-1" data-card="ecg">🫀 ECG</button>
        <button type="button" class="atlas-tab" id="atlas-tab-auscultation" role="tab" aria-selected="false" aria-controls="atlas-frame-auscultation" tabindex="-1" data-card="auscultation">🩺 Cardiology Auscultation</button>
      </nav>
    </div>
  </header>

  <main class="atlas-stage">
    <iframe id="atlas-frame-circle" class="atlas-frame active" role="tabpanel" aria-labelledby="atlas-tab-circle" title="Circle of Willis interactive atlas" src="circle-of-willis-atlas.html?embed=1&amp;v=7"></iframe>
    <iframe id="atlas-frame-nephron" class="atlas-frame" role="tabpanel" aria-labelledby="atlas-tab-nephron" title="Nephron interactive atlas" src="nephron-atlas.html?embed=1&amp;v=7"></iframe>
    <iframe id="atlas-frame-ecg" class="atlas-frame" role="tabpanel" aria-labelledby="atlas-tab-ecg" title="ECG interactive atlas" src="ecg-atlas.html?embed=1&amp;v=7"></iframe>
    <iframe id="atlas-frame-auscultation" class="atlas-frame" role="tabpanel" aria-labelledby="atlas-tab-auscultation" title="Cardiology Auscultation interactive atlas" src="cardiology-auscultation-atlas.html?embed=1&amp;v=7"></iframe>
  </main>

  <footer class="atlas-copyright">© Dr. Ram Aryal · MedArena Atlas</footer>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'medarena.atlas.activeCard';
      const buttons = Array.from(document.querySelectorAll('.atlas-tab'));
      const frames = Array.from(document.querySelectorAll('.atlas-frame'));

      function activate(card, moveFocus) {
        buttons.forEach((button) => {
          const selected = button.dataset.card === card;
          button.setAttribute('aria-selected', selected ? 'true' : 'false');
          button.tabIndex = selected ? 0 : -1;
        });

        frames.forEach((frame) => {
          frame.classList.toggle('active', frame.id === 'atlas-frame-' + card);
        });

        try { localStorage.setItem(STORAGE_KEY, card); } catch (e) {}
        if (moveFocus) {
          const target = buttons.find((button) => button.dataset.card === card);
          if (target) target.focus();
        }
      }

      buttons.forEach((button, index) => {
        button.addEventListener('click', () => activate(button.dataset.card));
        button.addEventListener('keydown', (event) => {
          if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
          event.preventDefault();
          const step = event.key === 'ArrowRight' ? 1 : -1;
          const next = buttons[(index + step + buttons.length) % buttons.length];
          activate(next.dataset.card, true);
        });
      });

      let saved = '';
      try { saved = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) {}
      if (saved && buttons.some((button) => button.dataset.card === saved)) activate(saved);
    })();
  </script>

  <script>
    /* Count one visit when the Atlas shell opens. The four iframe cards are
       deliberately not tracked: switching cards is not a new page visit. */
    (function () {
      'use strict';

      function recordVisit() {
        var cloud = String(window.MA_API_BASE || '').trim();
        var localHost = /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname);
        var base = '';

        if (!localHost) {
          try {
            var override = String(localStorage.getItem('ma_api_base') || '').trim();
            // "-" means "use the same-origin API" even on a hosted page.
            base = override === '-' ? '' : (override || cloud);
          } catch (e) {
            base = cloud;
          }
        }

        base = base.replace(/\/+$/, '');
        var init = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page: 'medarena-atlas.html' }),
          keepalive: true
        };
        if (base) {
          init.mode = 'cors';
          init.credentials = 'omit';
        }

        try {
          fetch(base + '/api/atlas/visit', init).catch(function () {});
        } catch (e) {}
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', recordVisit, { once: true });
      } else {
        recordVisit();
      }
    })();
  </script>
</body>
</html>
